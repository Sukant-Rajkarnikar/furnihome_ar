allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = '../build'

// Older Flutter plugins may declare their Android package only in
// AndroidManifest.xml. AGP 8 requires the same value as `namespace`.
subprojects {
    buildscript {
        configurations.classpath {
            resolutionStrategy.force "org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.22"
        }
    }

    tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
        kotlinOptions.jvmTarget = '11'
    }

    tasks.withType(JavaCompile).configureEach {
        options.compilerArgs += ['-Xlint:-options']
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }

    afterEvaluate { project ->
        def androidExtension = project.extensions.findByName('android')
        if (androidExtension != null) {
            androidExtension.compileOptions {
                sourceCompatibility JavaVersion.VERSION_11
                targetCompatibility JavaVersion.VERSION_11
            }
        }
        
        def manifestFile = project.file('src/main/AndroidManifest.xml')
        if (!androidExtension?.namespace && manifestFile.exists()) {
            def packageName = new XmlSlurper().parse(manifestFile).@package.text()
            if (packageName) {
                androidExtension.namespace = packageName
            }
        }
    }
}

subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(':app')
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
