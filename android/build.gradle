buildscript {
    ext.kotlin_version = '1.9.22'
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.3.2'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = '../build'

// Older Flutter plugins may declare their Android package only in
// AndroidManifest.xml. AGP 8 requires the same value as `namespace`.
subprojects {
    buildscript {
        configurations.classpath {
            resolutionStrategy.force "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        }
    }

    tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
        kotlinOptions.jvmTarget = '1.8'
    }

    tasks.withType(JavaCompile).configureEach {
        options.compilerArgs += ['-Xlint:-options']
    }

    afterEvaluate { project ->
        def androidExtension = project.extensions.findByName('android')
        def manifestFile = project.file('src/main/AndroidManifest.xml')
        if (!androidExtension?.namespace && manifestFile.exists()) {
            def packageName = new XmlSlurper().parse(manifestFile).@package.text()
            if (packageName) {
                androidExtension.namespace = packageName
            }
        }
    }
}

subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(':app')
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
